<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilities Page</title>
    <link rel="stylesheet" href="css/utilities_page.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="pictures/Group 12.png" alt="Barangay Logo" class="logo">
            <span class="version">B.P.U.R.S</span>
        </div>
        <div class="dropdown">
            <button class="dropdown-btn">Menu ▼</button>
            <div class="dropdown-content">
                <a href="#">Home</a>
                <a href="#">View Utilities</a>
                <a href="#">Tutorial</a>
                <a href="#">My List</a>
            </div>
        </div>
    </header>
    <main>
        <section class="construction">
            <h2>CONSTRUCTIONS</h2>
            <div class="grid">
                <img src="Utilities/wood_saw.webp" alt="wood_saw" class="clickable">
                <img src="Utilities/hammer.webp" alt="hammer" class="clickable">
                <img src="Utilities/wrench_set.png" alt="wrench_set" class="clickable">
                <img src="Utilities/tape_measure.jpg" alt="tape_measure" class="clickable">
                <img src="Utilities/grinder.webp" alt="grinder" class="clickable">
                <img src="Utilities/drill.webp" alt="drill" class="clickable">
                <img src="Utilities/jigsaw.webp" alt="jigsaw" class="clickable">
                <img src="Utilities/steel_saw.webp" alt="steel_saw" class="clickable">
                <img src="Utilities/screwdriver.webp" alt="screwdriver" class="clickable">
                <img src="Utilities/ladder.png" alt="ladder" class="clickable">
            </div>
        </section>
        <section class="medical">
            <h2>MEDICAL</h2>
            <div class="grid">
                <img src="Utilities/blood_pressure_cuff.webp" alt="blood_pressure_cuff" class="clickable">
                <img src="Utilities/oxygen_tank.webp" alt="oxygen_tank" class="clickable">
                <img src="Utilities/wheelchair.webp" alt="wheelchair" class="clickable">
                <img src="Utilities/nebulizer.webp" alt="nebulizer" class="clickable">
            </div>
        </section>
        <section class="sports">
            <h2>SPORTS</h2>
            <div class="grid">
                <img src="Utilities/basketball.webp" alt="basketball" class="clickable">
                <img src="Utilities/volleyball.png" alt="volleyball" class="clickable">
                <img src="Utilities/volleyball_net.png" alt="volleyball_net" class="clickable">
                <img src="Utilities/dome_cone.png" alt="dome_cone" class="clickable">
                <img src="Utilities/triangle_cone.png" alt="triangle_cone" class="clickable">
            </div>
        </section>
        <section class="events">
            <h2>EVENTS</h2>
            <div class="grid">
                <img src="Utilities/projector_screen.webp" alt="projector_screen" class="clickable">
                <img src="Utilities/projector.png" alt="projector" class="clickable">
                <img src="Utilities/mic.webp" alt="mic" class="clickable">
                <img src="Utilities/wireless_mic.webp" alt="wireless_mic" class="clickable">
                <img src="Utilities/tent.webp" alt="tent" class="clickable">
                <img src="Utilities/sounds.png" alt="sounds" class="clickable">
            </div>
        </section>
    </main>
    <script src="../js/utilities_page.js"></script>
</body>
</html>
